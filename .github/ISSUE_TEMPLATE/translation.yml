name: Translation
description: Share a Hearth language file you wrote
title: "[Translation] <language>"
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for translating Hearth. Start from `docs/languages/en.json` (see the Language files guide). Translations are written by people; we do not accept machine translations, and we do not change your wording. Accepted languages are built into the next Hearth release, so every user (rooted or not) can choose them.
        GitHub does not accept a `.json` attachment and the file is too long to paste: put it in a `.zip` and drag the zip into the box below.
  - type: input
    id: language
    attributes:
      label: Language name and code
      placeholder: "Deutsch, de"
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The language file (zip)
      description: Drag the zip with your `.json` file here.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hearth version it was made for
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: How much did you translate?
      options:
        - Everything
        - Most of it (the rest stays English)
        - Only part of it
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirm
      options:
        - label: I wrote this translation myself (not by machine) and it may be shared with Hearth under its licence.
          required: true
        - label: I loaded it on my TV (System -> Hearth language) and the letters show correctly.
  - type: input
    id: credit
    attributes:
      label: Name for the credits (optional)
      placeholder: "GitHub name, or leave empty"
